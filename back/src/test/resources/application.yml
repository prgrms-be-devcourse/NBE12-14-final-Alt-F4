spring:
  datasource:
    # 인메모리 모드로 H2 실행 (테스트 종료 시 데이터 자동 초기화)
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      # 테스트 시작 시 엔티티를 기반으로 테이블 자동 생성, 종료 시 삭제
      ddl-auto: create-drop
    properties:
      hibernate:
        # 콘솔에 실행되는 SQL 쿼리 포맷팅 출력
        format_sql: true
    show-sql: true
