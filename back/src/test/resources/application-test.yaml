spring:
  datasource:
    # Testcontainers가 MySQL 컨테이너를 띄운다. 같은 URL이면 테스트 전체가 컨테이너 하나를 공유한다.
    # 버전은 docker-compose.yml의 운영 MySQL과 맞춘다.
    url: jdbc:tc:mysql:8.0:///live-calendar-db?characterEncoding=UTF-8
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    username: test
    password: test

  jpa:
    hibernate:
      # 테스트 DB도 Flyway가 만든다. SQL과 엔티티가 다르면 테스트가 시작할 때 실패한다
      ddl-auto: validate
    properties:
      hibernate:
        # 콘솔에 실행되는 SQL 쿼리 포맷팅 출력
        format_sql: true
    show-sql: true

  test:
    database:
      # @DataJpaTest가 DataSource를 내장 DB로 바꾸지 않고 위 MySQL을 그대로 쓰게 한다
      replace: none

app:
  cors:
    allowed-origins:
      - http://localhost:3000
  auth:
    cookie:
      secure: false
  # 테스트 전용 값
  sqids:
    room-alphabet: 9T1CV48Z7FQGS0KY3HMBAJWNXD2PR6E5
    user-alphabet: D7KS2RHYQ3FEAX1BJGZVT5WMNC694P80

jwt:
  secret: test-only-secret-key-not-for-production-0123456789