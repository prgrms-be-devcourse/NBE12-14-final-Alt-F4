spring:
  datasource:
    url: jdbc:mysql://localhost:3306/live-calendar-db?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origins:
      - http://localhost:3000
  auth:
    cookie:
      secure: false

logging:
  level:
    org.hibernate.SQL: debug