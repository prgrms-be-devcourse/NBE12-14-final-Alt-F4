spring:
  datasource:
    url: jdbc:mysql://localhost:3306/live-calendar-db?serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

app:
  cors:
    allowed-origins:
      - http://localhost:3000
  auth:
    cookie:
      secure: false
  # 로컬 전용 값. 공개 저장소에 올라가므로 운영에는 다른 값을 환경변수로 넣는다
  sqids:
    room-alphabet: T09FCJM2BH163XWVAGRQNZ5PSD4YKE87
    user-alphabet: JZ1EVH0MTQG73RNS895DWKB6FAP2YX4C

logging:
  level:
    org.hibernate.SQL: debug