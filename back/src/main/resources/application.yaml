spring:
  application:
    name: live-calendar
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  endpoint:
    health:
      show-details: never
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: live-calendar

jwt:
  secret: ${JWT_SECRET}
  issuer: live-calendar
  access-token-expiry: 30m
  refresh-token-expiry: 14d