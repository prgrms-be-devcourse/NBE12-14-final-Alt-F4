
spring:
  application:
    name: live-calendar

  datasource:
    url: jdbc:mysql://localhost:3306/live-calendar-db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus

  endpoint:
    health:
      show-details: when_authorized

  prometheus:
    metrics:
      export:
        enabled: true

  metrics:
    tags:
      application: live-calendar
