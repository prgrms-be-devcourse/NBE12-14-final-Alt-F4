
name: develop pr test

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 1. 백엔드 CI
  back-check:
    name: Check the Backend for CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect backend changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            back:
              - 'back/**'
              - '.github/workflows/ci.yml'

      - name: Set up Java 25
        if: ${{ steps.filter.outputs.back == 'true' }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        if: ${{ steps.filter.outputs.back == 'true' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Run all backend tests
        if: ${{ steps.filter.outputs.back == 'true' }}
        run: bash ./gradlew test --build-cache

      - name: Upload backend test reports
        if: ${{ failure() && steps.filter.outputs.back == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: back-test-reports
          path: |
            back/build/test-results/test
            back/build/reports/tests/test
          retention-days: 7
          if-no-files-found: warn

      - name: Report backend success
        if: ${{ success() && steps.filter.outputs.back == 'true' }}
        run: echo "🎉 Backend CI checks passed successfully."

  # 2. 프론트엔드 CI
  front-check:
    name: Check the Frontend for CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect frontend changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            front:
              - 'front/**'
              - '.github/workflows/ci.yml'

      - name: Set up Node.js 22
        if: ${{ steps.filter.outputs.front == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Cache frontend build & lint outputs
        if: ${{ steps.filter.outputs.front == 'true' }}
        uses: actions/cache@v4
        with:
          path: |
            front/.next/cache
            front/node_modules/.cache
            front/.eslintcache
            front/*.tsbuildinfo
          key: ${{ runner.os }}-front-build-${{ hashFiles('front/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-front-build-${{ hashFiles('front/package-lock.json') }}-
            ${{ runner.os }}-front-build-

      - name: Install dependencies
        if: ${{ steps.filter.outputs.front == 'true' }}
        run: npm ci --prefer-offline --no-audit

      - name: Run lint
        if: ${{ steps.filter.outputs.front == 'true' }}
        run: npm run lint

      - name: Run type check
        if: ${{ steps.filter.outputs.front == 'true' }}
        run: npm run typecheck

      - name: Build frontend
        if: ${{ steps.filter.outputs.front == 'true' }}
        run: npm run build

      - name: Report frontend success
        if: ${{ success() && steps.filter.outputs.front == 'true' }}
        run: echo "🎉 Frontend CI checks passed successfully."
