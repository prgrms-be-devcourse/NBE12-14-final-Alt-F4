name: develop pr test

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: pull-request-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # 1. 변경된 파일 경로 감지 Job
  changes:
    name: Detect Changed Folders
    runs-on: ubuntu-latest
    outputs:
      back: ${{ steps.filter.outputs.back }}
      front: ${{ steps.filter.outputs.front }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Filter changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            back:
              - 'back/**'
              - '.github/workflows/ci.yml'
            front:
              - 'front/**'
              - '.github/workflows/ci.yml'

  # 2. 백엔드 CI (Gradle 빌드 캐시 최적화)
  back-check:
    name: Check the Backend for CI
    needs: changes
    if: ${{ needs.changes.outputs.back == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # Gradle 전용 캐싱 및 빌드 최적화 액션
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      # --build-cache 옵션으로 이전 빌드 산출물 재사용
      - name: Run all backend tests
        run: ./gradlew test --build-cache

      - name: Upload backend test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: back-test-reports
          path: |
            back/build/test-results/test
            back/build/reports/tests/test
          retention-days: 7
          if-no-files-found: warn

      - name: Report backend success
        if: ${{ success() }}
        run: echo "🎉 Backend CI checks passed successfully."

  # 3. 프론트엔드 CI (npm + 프레임워크/린트 증분 캐시 최적화)
  front-check:
    name: Check the Frontend for CI
    needs: changes
    if: ${{ needs.changes.outputs.front == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: front/package-lock.json

      # 빌드/린트 증분 캐시 복원 및 저장 (Next.js, Vite, ESLint 등)
      - name: Cache frontend build & lint outputs
        uses: actions/cache@v4
        with:
          path: |
            front/.next/cache
            front/node_modules/.cache
            front/.eslintcache
            front/*.tsbuildinfo
          key: ${{ runner.os }}-front-build-${{ hashFiles('front/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-front-build-${{ hashFiles('front/package-lock.json') }}-
            ${{ runner.os }}-front-build-

      # --prefer-offline으로 캐시 우선 참조 및 네트워크 왕복 최소화
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Run lint
        run: npm run lint

      - name: Run type check
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Report frontend success
        if: ${{ success() }}
        run: echo "🎉 Frontend CI checks passed successfully."
