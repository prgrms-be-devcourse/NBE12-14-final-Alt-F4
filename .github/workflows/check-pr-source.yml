name: Check PR Source Branch

on:
  pull_request:
    branches:
      - main

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source branch is develop
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "❌ 에러: main 브랜치로의 PR은 오직 develop 브랜치에서만 생성할 수 있습니다. (현재 소스 브랜치: ${{ github.head_ref }})"
            exit 1
          fi
          echo "✅ 확인 완료: develop 브랜치에서 생성된 PR입니다."
